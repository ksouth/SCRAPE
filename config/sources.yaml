# Data sources configuration
# SCRAPE: NDIS Data Aggregator

sources:
  # NDIA Accountability Project - FOI Documents
  - name: "NDIA Accountability - Documents"
    type: "website"
    url: "https://ndiaaccountability.org/library/documents/"
    enabled: true
    schedule: "0 0 * * *"  # Daily at midnight
    selectors:
      documents: "div[class*='document']"  # Document containers
      title: "h2, h3"                      # Document title
      content: "p, div[class*='content']"  # Document content
      url: "a[href*='/']"                  # Link to document
    headers:
      User-Agent: "SCRAPE-Bot/1.0 (+https://github.com/ksouth/SCRAPE)"
    timeout: 30

  # NDIA Accountability - Inquiry Submissions
  - name: "NDIA Accountability - Submissions"
    type: "website"
    url: "https://ndiaaccountability.org/library/external-submissions/"
    enabled: true
    schedule: "0 1 * * *"  # Daily at 1am
    selectors:
      documents: "li, div[class*='submission']"
      title: "a, h3"
      content: "p"
      url: "a[href]"
    headers:
      User-Agent: "SCRAPE-Bot/1.0 (+https://github.com/ksouth/SCRAPE)"
    timeout: 30

  # NDIS Decoded - Glossary & Blog
  - name: "NDIS Decoded - Glossary & Articles"
    type: "website"
    url: "https://decodendis.pplx.app/"
    enabled: true
    schedule: "0 2 * * 0"  # Weekly on Sunday at 2am
    selectors:
      documents: "article, div[class*='term']"  # Articles and glossary terms
      title: "h1, h2, h3, .term-title"          # Titles
      content: "p, .content, .term-definition"  # Content
      url: "a[href]"                            # Links
    headers:
      User-Agent: "SCRAPE-Bot/1.0 (+https://github.com/ksouth/SCRAPE)"
    timeout: 30

# Processing configuration
processing:
  chunk_size: 512              # Characters per chunk
  chunk_overlap: 100           # Overlap between chunks
  embedding_model: "all-MiniLM-L6-v2"  # HuggingFace model
  use_openai: false            # Use OpenAI API for embeddings
  ocr_enabled: true            # Enable OCR for PDFs
  ocr_lang: "eng"              # Tesseract language

# Storage configuration
storage:
  vector_db: "chroma"
  chroma_host: "localhost"
  chroma_port: 8000
  collection_name: "documents"

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "logs/scraper.log"
